    {id:50,dim:'N',         text:'မိမိကို မည်သို့ အကဲဖြတ်နေသနည်းဟု စိုးရိမ်မှုရပ်မသွားသောအချိန်များ ရှိသည်'},
    {id:51,dim:'V', text:'သူတစ်ပါး၏ အပြစ်တင်ခြင်းကို ပြောဆိုခြင်း သို့မဟုတ် နှလုံးထဲတွင် တွေးခြင်း တစ်ကြိမ်မျှ မဖူးဖူးပါ'},
    {id:52,dim:'V', text:'ကတိ သို့မဟုတ် သတ်မှတ်ရက်ကို ချိုးဖောက်ဖူးသောကိစ္စ ယခုအချိန်ထိ တစ်ကြိမ်မျှ မရှိပါ'},
    {id:53,dim:'V', text:'မည်သူ့ကိုမဆို မုသာပြောဖူးသောကိစ္စ မည်မျှသေးသောအရာမဆို တစ်ကြိမ်မျှ မရှိပါ'},
    {id:54,dim:'V', text:'အလုပ် သို့မဟုတ် ပညာသင်ကြားရာ၌ လိမ်လည်ချင်သည်ဟု တွေးဖူးသောကိစ္စ တစ်ကြိမ်မျှ မရှိပါ'},
    {id:55,dim:'V', text:'မိမိကိုယ်ထက် သူတစ်ပါးကို ဦးစားပေးသည်မှာ အမြဲတမ်း သဘာဝကျကျ ဆောင်ရွက်နိုင်သည်'},
  ],
};

function buildOrder(qs){
  const main=qs.filter(q=>q.dim!=='V'), v=qs.filter(q=>q.dim==='V'), r=[...main];
  [9,19,29,39,49].forEach((p,i)=>r.splice(p+i,0,v[i])); return r;
}
function calcScores(ans,qs){
  const s={O:0,C:0,E:0,A:0,N:0}, c={O:0,C:0,E:0,A:0,N:0};
  qs.filter(q=>q.dim!=='V').forEach(q=>{ const v=ans[q.id]; if(v==null)return; s[q.dim]+=q.r?6-v:v; c[q.dim]++; });
  const o={}; Object.keys(s).forEach(d=>{o[d]=c[d]?Math.round((s[d]/(c[d]*5))*100):0;}); return o;
}
function checkV(ans,qs){
  const v=qs.filter(q=>q.dim==='V');
  const suspicious=v.filter(q=>(ans[q.id]||0)>=4).length;
  let level, ok;
  if(suspicious===0)     { level='high';    ok=true;  }
  else if(suspicious===1){ level='good';    ok=true;  }
  else if(suspicious<=3) { level='caution'; ok=false; }
  else                   { level='alert';   ok=false; }
  return { ok, level, suspicious, total:v.length };
}

let state = { phase:'code', lang:null, codeObj:null, answers:{}, currentQ:0, displayQs:[], error:'', submitting:false, candidateName:'', candidateNumber:'' };

function render() {
  const app=document.getElementById('app'); app.innerHTML='';
  const div=document.createElement('div');
  if(state.phase==='code')  div.innerHTML=renderCode();
  if(state.phase==='info')  div.innerHTML=renderInfo();
  if(state.phase==='intro') div.innerHTML=renderIntro();
  if(state.phase==='test')  div.innerHTML=renderTest();
  if(state.phase==='done')  div.innerHTML=renderDone();
  app.appendChild(div); bindEvents();
}

function renderCode() {
  return `<div class="card" style="text-align:center">
    <div style="font-size:52px;margin-bottom:14px">🧠</div>
    <h1 style="font-size:22px;margin-bottom:6px">候補者<br>性格診断テスト</h1>
    <p style="color:rgba(255,255,255,0.4);font-size:13px;margin-bottom:24px">Big Five × Tokutei Ginou</p>
    <div class="code-hints">
      <p>🇯🇵 受験コードを入力してください</p>
      <p>🇮🇩 Masukkan kode ujian Anda</p>
      <p>🇲🇲 စစ်ဆေးမှုကုဒ်ကို ထည့်သွင်းပေးပါ</p>
    </div>
    <input id="codeInput" class="code-input" placeholder="XXXX-XXXX-XXXX" maxlength="14" oninput="this.value=this.value.toUpperCase()">
    ${state.error?`<p class="error">${state.error}</p>`:''}
    <button class="btn btn-primary" id="codeBtn">開始する / Mulai / စတင်မည်</button>
  </div>`;
}

function renderInfo() {
  const ui=UI[state.lang];
  return `<div class="card">
    <div style="font-size:36px;margin-bottom:14px;text-align:center">✏️</div>
    <h2 style="font-size:18px;margin-bottom:20px;text-align:center">${ui.nameLabel} / ${ui.numberLabel}</h2>
    <div class="input-group">
      <label class="label">${ui.nameLabel}<span class="required">${ui.nameRequired}</span></label>
      <input id="nameInput" placeholder="${ui.namePlaceholder}" value="${state.candidateName}">
      ${state.error?`<p class="error">${state.error}</p>`:''}
    </div>
    <div class="input-group">
      <label class="label">${ui.numberLabel}<span style="color:rgba(255,255,255,0.4);margin-left:3px">${ui.numberOptional}</span></label>
      <input id="numberInput" placeholder="${ui.numberPlaceholder}" value="${state.candidateNumber}">
    </div>
    <button class="btn btn-primary" id="infoNextBtn" style="margin-top:8px">次へ / Next →</button>
  </div>`;
}

function renderIntro() {
  const ui=UI[state.lang];
  const tags=Object.entries(DIMS).map(([k,d])=>
    `<div class="dim-tag" style="background:${d.color}18;border:1px solid ${d.color}44;color:${d.color}">${d.icon} ${d[state.lang].name}</div>`
  ).join('');
  return `<div class="card" style="text-align:center">
    <div style="font-size:42px;margin-bottom:12px">🧠</div>
    <h2 style="font-size:20px;margin-bottom:6px">${ui.title}</h2>
    <p class="subtitle">${ui.subtitle}</p>
    <p class="desc">${ui.desc}</p>
    <div class="dim-tags">${tags}</div>
    <button class="btn btn-primary" id="startBtn">${ui.startBtn} →</button>
  </div>`;
}

function renderTest() {
  const q=state.displayQs[state.currentQ]; if(!q) return '';
  const ui=UI[state.lang];
  const total=state.displayQs.length, answered=Object.keys(state.answers).length;
  const pct=Math.round(((state.currentQ+1)/total)*100);
  const dimKey=q.dim==='V'?'C':q.dim, dim=DIMS[dimKey], cur=state.answers[q.id];
  const allDone=answered===total;
  const scaleBtns=[1,2,3,4,5].map(v=>{
    const sel=cur===v;
    return `<button class="scale-btn" data-val="${v}" style="${sel?`border-color:${dim.color};background:${dim.color}22;color:${dim.color}`:''}"> ${v}</button>`;
  }).join('');
  return `<div class="card">
    <div class="progress-wrap">
      <div class="progress-info">
        <span>${state.currentQ+1} / ${total} ${ui.progress}</span>
        <span>${pct}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div style="height:24px;margin-bottom:16px"></div>
    <p class="question">${q.text}</p>
    <div class="scale-btns">${scaleBtns}</div>
    <div class="scale-labels"><span>${ui.scaleLabels[0]}</span><span>${ui.scaleLabels[4]}</span></div>
    <div class="nav-btns">
      ${state.currentQ>0?`<button class="btn btn-ghost" id="prevBtn" style="flex:1">← ${ui.prev}</button>`:''}
      ${allDone?`<button class="btn btn-green" id="submitBtn" style="flex:2;opacity:${state.submitting?0.6:1}">${state.submitting?'送信中...':'✓ '+ui.submit}</button>`:''}
    </div>
    ${!allDone&&state.currentQ===total-1?`<p style="color:rgba(255,255,255,0.3);font-size:11px;text-align:center;margin-top:10px">${ui.unanswered(total-answered)}</p>`:''}
  </div>`;
}

function renderDone() {
  const ui=UI[state.lang];
  const note=state.lang==='ja'?'このページを面接官にお見せください。':state.lang==='id'?'Tunjukkan halaman ini kepada pewawancara.':'ဤစာမျက်နှာကို အင်တာဗျူးသူအား ပြပေးပါ။';
  return `<div class="card" style="text-align:center">
    <div style="font-size:64px;margin-bottom:20px">✅</div>
    <h2 style="font-size:24px;margin-bottom:12px">${ui.thankyouTitle}</h2>
    <p style="color:rgba(255,255,255,0.55);font-size:15px;line-height:1.8">${ui.thankyouBody}</p>
    <div class="thankyou-note"><p>${note}</p></div>
  </div>`;
}

function bindEvents() {
  const codeBtn=document.getElementById('codeBtn');
  if(codeBtn) codeBtn.addEventListener('click',handleCodeSubmit);
  const codeInput=document.getElementById('codeInput');
  if(codeInput) codeInput.addEventListener('keydown',e=>{if(e.key==='Enter')handleCodeSubmit();});
  const infoNextBtn=document.getElementById('infoNextBtn');
  if(infoNextBtn) infoNextBtn.addEventListener('click',()=>{
    const name=document.getElementById('nameInput')?.value.trim();
    const number=document.getElementById('numberInput')?.value.trim();
    if(!name){state.error=UI[state.lang].nameError;render();return;}
    state.candidateName=name; state.candidateNumber=number; state.error=''; state.phase='intro'; render();
  });
  const startBtn=document.getElementById('startBtn');
  if(startBtn) startBtn.addEventListener('click',()=>{
    state.answers={}; state.currentQ=0; state.displayQs=buildOrder(QUESTIONS[state.lang]); state.phase='test'; render();
  });
  document.querySelectorAll('.scale-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const val=parseInt(btn.dataset.val), q=state.displayQs[state.currentQ];
      state.answers[q.id]=val;
      if(state.currentQ<state.displayQs.length-1) state.currentQ++;
      render();
    });
  });
  const prevBtn=document.getElementById('prevBtn');
  if(prevBtn) prevBtn.addEventListener('click',()=>{state.currentQ--;render();});
  const submitBtn=document.getElementById('submitBtn');
  if(submitBtn) submitBtn.addEventListener('click',handleSubmit);
}

async function handleCodeSubmit() {
  const input=document.getElementById('codeInput');
  const code=input?input.value.trim().toUpperCase():'';
  if(!code){state.error='コードを入力してください';render();return;}
  // ★ 有効期限チェックなし（削除されるまで有効）
  const {data,error}=await sb.from('codes').select('*').eq('code',code).single();
  if(error||!data){state.error='コードが無効です / Kode tidak valid / ကုဒ်မမှန်ကန်';render();return;}
  state.codeObj=data; state.lang=data.lang; state.error=''; state.phase='info'; render();
}

async function handleSubmit() {
  if(state.submitting) return;
  state.submitting=true; render();
  const scores=calcScores(state.answers,QUESTIONS[state.lang]);
  const validity=checkV(state.answers,QUESTIONS[state.lang]);
  const displayName=state.candidateNumber
    ?`${state.candidateNumber}_${state.candidateName}`
    :state.candidateName;
  await sb.from('results').insert({
    code:state.codeObj.code, name:displayName, lang:state.lang,
    date:new Date().toISOString(), scores, validity,
  });
  state.submitting=false; state.phase='done'; render();
}

render();
</script>
